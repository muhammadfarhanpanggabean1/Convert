<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konverter Gambar</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6bcb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Konverter">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#10202b;--mut:#5d6b78;--ac:#0b6bcb;--acx:#fff;--bd:#d5dbe1;--ok:#15803d;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141a;--card:#16202a;--tx:#e6edf3;--mut:#93a1ae;--ac:#4aa3ff;--acx:#06121f;--bd:#27343f;--ok:#4ade80;--er:#f97066}}
:root[data-theme="dark"]{--bg:#0d141a;--card:#16202a;--tx:#e6edf3;--mut:#93a1ae;--ac:#4aa3ff;--acx:#06121f;--bd:#27343f;--ok:#4ade80;--er:#f97066}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px}
#drop{display:block;border:2px dashed var(--bd);border-radius:14px;background:var(--card);padding:34px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
#drop.on,#drop:hover,#drop:focus-within{border-color:var(--ac)}
#drop strong{display:block;font-size:1.1rem}
#drop span{color:var(--mut);font-size:.9rem}
#drop input{position:absolute;opacity:0;width:1px;height:1px}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--tx);padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--acx)}
label.q{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.9rem}
input[type=range]{accent-color:var(--ac);width:130px}
button:focus-visible,#drop:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:var(--acx)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.45;cursor:default}
.sp{flex:1}
#sum{color:var(--mut);font-size:.9rem;min-height:1.4em}
ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px 8px 8px}
li img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bd);flex:none}
.in{min-width:0;flex:1}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.95rem}
.st{font-size:.82rem;color:var(--mut)}
.st.ok{color:var(--ok)}.st.er{color:var(--er)}
.fn{font-size:.75rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{display:flex;flex-direction:column;gap:3px;flex:none}
.mv button{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:6px;width:34px;height:24px;font-size:.7rem;line-height:1;padding:0;cursor:pointer}
.mv button:disabled{opacity:.3;cursor:default}
li a{font-weight:600;font-size:.9rem;color:var(--ac);text-decoration:none;padding:6px}
.prog{height:3px;background:var(--bd);border-radius:2px;margin-top:14px;overflow:hidden;visibility:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .1s}
</style>
</head>
<body>
<main>
  <h1>Konverter Gambar</h1>
  <p class="sub">JPG, PNG, dan WebP. Berjalan di perangkatmu; file tidak diunggah ke mana pun.</p>

  <div class="bar" id="inst" style="display:none;margin-top:0"><button class="btn" id="instBtn">Pasang aplikasi</button></div>
  <p class="sub" id="instMsg" style="font-size:.85rem"></p>

  <label id="drop">
    <input id="pick" type="file" accept="image/*,application/octet-stream" multiple>
    <strong>Letakkan banyak gambar di sini</strong>
    <span>atau ketuk untuk memilih</span>
  </label>

  <div class="bar">
    <div class="seg" id="fmt" role="group" aria-label="Format tujuan">
      <button data-f="image/jpeg" data-x="jpg" aria-pressed="false">JPG</button>
      <button data-f="image/png" data-x="png" aria-pressed="false">PNG</button>
      <button data-f="image/webp" data-x="webp" aria-pressed="true">WebP</button>
    </div>
    <label class="q" id="qw">Kualitas <input id="q" type="range" min="40" max="100" value="85"> <span id="qv">85</span></label>
  </div>

  <div class="bar" style="margin-top:0;align-items:flex-start;flex-direction:column;gap:4px">
    <label for="nm" style="font-size:.9rem">Pola nama file</label>
    <input id="nm" type="text" value="{nama}" autocomplete="off" spellcheck="false" style="width:100%;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:9px 12px;font:inherit">
    <div id="nmv" style="color:var(--mut);font-size:.8rem"></div>
  </div>

  <div class="bar" style="margin-top:0">
    <div id="sum"></div>
    <div class="sp"></div>
    <button class="btn g" id="folder" style="display:none">Pilih folder</button>
    <button class="btn g" id="share" style="display:none" disabled>Bagikan</button>
    <button class="btn g" id="clr" disabled>Kosongkan</button>
    <button class="btn" id="zip" disabled>Unduh semua (ZIP)</button>
  </div>
  <div class="prog" id="prog"><i></i></div>
  <ul id="list"></ul>
  <p class="sub" style="margin-top:24px;font-size:.8rem">Versi 13</p>
</main>

<script>
(function(){
  var items=[], fmt="image/webp", ext="webp", quality=.85, gen=0, uid=0;
  var list=document.getElementById("list"), sum=document.getElementById("sum");
  var zipBtn=document.getElementById("zip"), clrBtn=document.getElementById("clr");
  var shareBtn=document.getElementById("share"), folderBtn=document.getElementById("folder");
  var dirHandle=null, note="", nt=null;
  var prog=document.getElementById("prog"), bar=prog.firstElementChild;
  var BUDGET=8*1048576, CHUNK=120*1048576;

  function fmtSize(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1)+" MB"}
  function baseName(n){return n.replace(/\.[^.]+$/,"")||"gambar"}
  function pause(ms){return new Promise(function(r){setTimeout(r,ms||0)})}

  // Hasil konversi disimpan di IndexedDB (disk), bukan di RAM
  var dbp=null;
  function db(){
    if(!dbp)dbp=new Promise(function(res,rej){
      try{var r=indexedDB.open("konverter",1);
        r.onupgradeneeded=function(){r.result.createObjectStore("o")};
        r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
      }catch(e){rej(e)}
    });
    return dbp;
  }
  function tx(mode,fn){
    return db().then(function(d){return new Promise(function(res,rej){
      var t=d.transaction("o",mode),q=fn(t.objectStore("o"));
      t.oncomplete=function(){res(q&&q.result)};t.onerror=t.onabort=function(){rej(t.error)};
    })});
  }
  async function saveOut(it,b){
    it.size=b.size;
    try{await tx("readwrite",function(s){return s.put(b,it.id)});it.mem=null}
    catch(e){it.mem=b}
  }
  async function getOut(it){
    if(it.mem)return it.mem;
    return tx("readonly",function(s){return s.get(it.id)});
  }
  function wipe(){return tx("readwrite",function(s){return s.clear()}).catch(function(){})}
  wipe();

  async function toBlob(bmp){
    var w=bmp.width,h=bmp.height,c,ctx;
    if(typeof OffscreenCanvas!=="undefined"){c=new OffscreenCanvas(w,h)}
    else{c=document.createElement("canvas");c.width=w;c.height=h}
    ctx=c.getContext("2d");
    if(fmt==="image/jpeg"){ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h)}
    ctx.drawImage(bmp,0,0);
    var q=fmt==="image/png"?undefined:quality, b;
    if(c.convertToBlob)b=await c.convertToBlob({type:fmt,quality:q});
    else b=await new Promise(function(res){c.toBlob(res,fmt,q)});
    c.width=c.height=0;
    return b;
  }

  async function makeThumb(bmp){
    var s=88/Math.max(bmp.width,bmp.height,1),w=Math.max(1,Math.round(bmp.width*s)),h=Math.max(1,Math.round(bmp.height*s));
    var c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(bmp,0,0,w,h);
    var b=await new Promise(function(res){c.toBlob(res,"image/jpeg",.7)});
    c.width=c.height=0;
    return b?URL.createObjectURL(b):null;
  }

  async function convert(it,g){
    var bmp=null;
    it.state="work";render(it);
    try{
      bmp=await createImageBitmap(it.file);
      if(!it.thumb)it.thumb=await makeThumb(bmp);
      var b=await toBlob(bmp);
      if(g!==gen)return;
      if(!b||b.type!==fmt)throw new Error("Format tidak didukung browser ini");
      await saveOut(it,b);
      it.state="ok";
    }catch(e){
      if(g!==gen)return;
      it.state="err";it.msg=(e&&e.message)||"Gagal dibaca";
    }finally{
      if(bmp&&bmp.close)bmp.close();
    }
    render(it);
  }

  // Penjadwal: sedikit file sekaligus, dibatasi total ukuran file yang sedang diproses
  async function run(){
    var g=++gen, queue=items.slice(), total=queue.length, done=0, active=0, inflight=0;
    if(!total){updateUI();return}
    prog.style.visibility="visible";bar.style.width="0";
    items.forEach(function(it){it.state="wait";it.size=0;render(it)});
    updateUI();
    await new Promise(function(resolve){
      function start(it){
        var sz=it.file.size;active++;inflight+=sz;
        convert(it,g).then(function(){
          active--;inflight-=sz;
          if(g===gen){done++;bar.style.width=(done/total*100)+"%";updateUI()}
          return pause(0);
        }).then(pump);
      }
      function pump(){
        if(g!==gen){if(!active)resolve();return}
        while(queue.length){
          var it=queue[0];
          if(active>0&&(active>=2||inflight+it.file.size>BUDGET))break;
          start(queue.shift());
        }
        if(!queue.length&&!active)resolve();
      }
      pump();
    });
    if(g===gen){setTimeout(function(){if(g===gen)prog.style.visibility="hidden"},400);updateUI()}
  }

  var nmIn=document.getElementById("nm"), nmv=document.getElementById("nmv");
  try{var sv=localStorage.getItem("konverter-nama");if(sv)nmIn.value=sv}catch(e){}

  // Pola: {nama} nama asli, {no} nomor urut, {tanggal} YYYY-MM-DD, {jam} HHMM
  function buildName(pat,orig,no,total){
    var d=new Date(),p2=function(n){return(n<10?"0":"")+n};
    var tgl=d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
    var jam=p2(d.getHours())+p2(d.getMinutes());
    var w=String(total).length,nn=String(no);while(nn.length<w)nn="0"+nn;
    var r=(pat||"{nama}").replace(/\{nama\}/g,baseName(orig)).replace(/\{no\}/g,nn)
      .replace(/\{tanggal\}/g,tgl).replace(/\{jam\}/g,jam)
      .replace(/[\\\/:*?"<>|]/g,"-").replace(/^[\s.]+|[\s.]+$/g,"");
    return(r||"gambar")+"."+ext;
  }
  function outName(it){
    var i=items.indexOf(it);
    return buildName(nmIn.value,it.file.name,(i<0?0:i)+1,Math.max(items.length,1));
  }
  function nmPreview(){
    var f=items.length?items[0].file.name:"foto.heic";
    nmv.textContent="Contoh: "+buildName(nmIn.value,f,1,Math.max(items.length,1))+"   ({nama} {no} {tanggal} {jam})";
  }
  nmIn.addEventListener("input",function(){
    try{localStorage.setItem("konverter-nama",nmIn.value)}catch(e){}
    nmPreview();scheduleRefresh();
  });

  function flash(t){
    note=t;sum.textContent=t;clearTimeout(nt);
    nt=setTimeout(function(){note="";updateUI()},4500);
  }

  function dlBlob(blob,name){
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},8000);
  }

  // Nama unik di dalam folder pilihan agar file lama tidak tertimpa
  async function uniqueIn(dir,name){
    var m=name.match(/^(.*?)(\.[^.]*)?$/),base=m[1],dot=m[2]||"",n=name,i=0;
    while(true){
      try{await dir.getFileHandle(n);i++;n=base+" ("+i+")"+dot}
      catch(e){return n}
    }
  }

  async function saveBlob(blob,name){
    if(dirHandle){
      try{
        var fh=await dirHandle.getFileHandle(await uniqueIn(dirHandle,name),{create:true});
        var w=await fh.createWritable();await w.write(blob);await w.close();
        return;
      }catch(e){
        dirHandle=null;folderBtn.textContent="Pilih folder";
        flash("Folder tidak bisa ditulis, memakai unduhan biasa.");
      }
    }
    dlBlob(blob,name);
  }

  // Urutan daftar = urutan nomor {no} dan urutan di ZIP
  var rt=null;
  function refreshOrder(){
    items.forEach(function(it,i){
      if(!it.li)return;
      it.li.querySelector(".up").disabled=i===0;
      it.li.querySelector(".dn").disabled=i===items.length-1;
      it.li.querySelector(".fn").textContent=it.state==="ok"?"\u2192 "+outName(it):"";
    });
  }
  function scheduleRefresh(){clearTimeout(rt);rt=setTimeout(refreshOrder,80)}
  function move(it,dir){
    var i=items.indexOf(it),j=i+dir;
    if(i<0||j<0||j>=items.length)return;
    items.splice(i,1);items.splice(j,0,it);
    items.forEach(function(x){if(x.li)list.appendChild(x.li)});
    refreshOrder();
  }

  function render(it){
    if(!it.li){
      it.li=document.createElement("li");
      it.li.innerHTML='<img alt=""><div class="in"><div class="nm"></div><div class="st"></div><div class="fn"></div></div><span class="mv"><button type="button" class="up" aria-label="Naikkan">&#9650;</button><button type="button" class="dn" aria-label="Turunkan">&#9660;</button></span>';
      it.li.querySelector(".nm").textContent=it.file.name;
      it.li.querySelector(".up").addEventListener("click",function(){move(it,-1)});
      it.li.querySelector(".dn").addEventListener("click",function(){move(it,1)});
      list.appendChild(it.li);
    }
    var st=it.li.querySelector(".st"),a=it.li.querySelector("a");
    if(it.thumb&&!it.thumbSet){it.li.querySelector("img").src=it.thumb;it.thumbSet=1}
    st.className="st";
    if(it.state==="ok"){
      var d=Math.round((1-it.size/it.file.size)*100);
      st.className="st ok";
      st.textContent=fmtSize(it.file.size)+" ke "+fmtSize(it.size)+(d>0?" (hemat "+d+"%)":"");
      if(!a){
        a=document.createElement("a");a.href="#";a.textContent="Unduh";
        a.addEventListener("click",async function(ev){
          ev.preventDefault();
          var b=await getOut(it);if(b)saveBlob(b,outName(it));
        });
        it.li.appendChild(a);
      }
    }else{
      if(a)a.remove();
      if(it.state==="err"){st.className="st er";st.textContent=it.msg}
      else st.textContent=it.state==="work"?"Mengonversi…":"Menunggu…";
    }
  }

  function updateUI(){
    var ok=items.filter(function(i){return i.state==="ok"}).length;
    zipBtn.disabled=!ok;clrBtn.disabled=!items.length;shareBtn.disabled=!ok;nmPreview();scheduleRefresh();
    sum.textContent=note||(items.length?ok+" dari "+items.length+" selesai":"");
  }

  function add(files){
    var n=0;
    Array.prototype.forEach.call(files,function(f){
      if(!/^image\//.test(f.type)&&!/\.(heic|heif)$/i.test(f.name))return;
      items.push({id:++uid,file:f,thumb:null,state:"wait",size:0});n++;
    });
    if(n)run();
  }

  var fb=document.querySelectorAll("#fmt button");
  Array.prototype.forEach.call(fb,function(b){
    b.addEventListener("click",function(){
      fmt=b.dataset.f;ext=b.dataset.x;
      Array.prototype.forEach.call(fb,function(o){o.setAttribute("aria-pressed",o===b)});
      document.getElementById("qw").style.display=fmt==="image/png"?"none":"flex";
      run();
    });
  });
  var q=document.getElementById("q"),qt=null;
  q.addEventListener("input",function(){
    quality=q.value/100;document.getElementById("qv").textContent=q.value;
    clearTimeout(qt);qt=setTimeout(run,250);
  });

  var drop=document.getElementById("drop"),pick=document.getElementById("pick");
  pick.addEventListener("change",function(){add(pick.files);pick.value=""});
  ["dragenter","dragover"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add("on")})});
  ["dragleave","drop"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove("on")})});
  drop.addEventListener("drop",function(ev){add(ev.dataTransfer.files)});
  window.addEventListener("dragover",function(e){e.preventDefault()});
  window.addEventListener("drop",function(e){e.preventDefault();if(e.target!==drop&&!drop.contains(e.target))add(e.dataTransfer.files)});

  clrBtn.addEventListener("click",function(){
    gen++;items.forEach(function(i){if(i.thumb)URL.revokeObjectURL(i.thumb)});
    items=[];list.innerHTML="";prog.style.visibility="hidden";updateUI();wipe();
  });

  // ZIP tanpa kompresi, dipecah per ~120 MB agar tidak membebani memori
  var T=new Uint32Array(256);
  for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
  function crc(u){var c=-1;for(var i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0}

  async function buildZip(group,used){
    var enc=new TextEncoder(),parts=[],cd=[],off=0;
    for(var i=0;i<group.length;i++){
      var it=group[i],blob=await getOut(it),nm=outName(it),cnt=used[nm]||0;
      used[nm]=cnt+1;if(cnt)nm=baseName(nm)+" ("+cnt+")."+ext;
      var size=blob.size,nb=enc.encode(nm),cr=crc(new Uint8Array(await blob.arrayBuffer()));
      var lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
      lh.setUint32(14,cr,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);lh.setUint16(26,nb.length,true);
      parts.push(lh.buffer,nb,blob);
      var ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
      ch.setUint32(16,cr,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
      cd.push(ch.buffer,nb);
      off+=30+nb.length+size;
    }
    var cdSize=0;cd.forEach(function(p){cdSize+=p.byteLength});
    var end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);end.setUint16(8,group.length,true);end.setUint16(10,group.length,true);
    end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
    return new Blob(parts.concat(cd,[end.buffer]),{type:"application/zip"});
  }

  zipBtn.addEventListener("click",async function(){
    var ready=items.filter(function(i){return i.state==="ok"});
    if(!ready.length)return;
    zipBtn.disabled=true;
    try{
      if(ready.length===1){var b=await getOut(ready[0]);if(b)await saveBlob(b,outName(ready[0]));return}
      if(dirHandle){
        var dn=dirHandle.name;
        for(var j=0;j<ready.length;j++){
          sum.textContent="Menyimpan "+(j+1)+" dari "+ready.length+"…";
          var fb2=await getOut(ready[j]);if(fb2)await saveBlob(fb2,outName(ready[j]));
        }
        if(dirHandle)flash(ready.length+" file tersimpan di folder "+dn+".");
        return;
      }
      var groups=[],cur=[],acc=0;
      ready.forEach(function(it){
        if(cur.length&&acc+it.size>CHUNK){groups.push(cur);cur=[];acc=0}
        cur.push(it);acc+=it.size;
      });
      if(cur.length)groups.push(cur);
      var used={};
      for(var i=0;i<groups.length;i++){
        sum.textContent="Membuat ZIP "+(i+1)+" dari "+groups.length+"…";
        var zb=await buildZip(groups[i],used);
        dlBlob(zb,"gambar-"+ext+(groups.length>1?"-"+(i+1):"")+".zip");
        await pause(900);
      }
    }catch(e){
      flash("Gagal. Coba unduh satuan.");
    }finally{
      zipBtn.disabled=false;updateUI();
    }
  });

  // Pilih folder tujuan (Chrome/Edge desktop)
  if("showDirectoryPicker" in window){
    folderBtn.style.display="";
    folderBtn.addEventListener("click",async function(){
      try{
        dirHandle=await window.showDirectoryPicker({mode:"readwrite"});
        folderBtn.textContent="Folder: "+dirHandle.name;
      }catch(e){
        if(e&&e.name!=="AbortError")flash("Folder tidak bisa dipilih.");
      }
    });
  }

  // Bagikan ke Files, Drive, WhatsApp, dll. (HP)
  var canShare=false;
  try{
    canShare=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([""],"a.jpg",{type:"image/jpeg"})]}));
  }catch(e){}
  if(canShare){
    shareBtn.style.display="";
    shareBtn.addEventListener("click",async function(){
      var ready=items.filter(function(i){return i.state==="ok"});
      if(!ready.length)return;
      shareBtn.disabled=true;
      try{
        var files=[],used={};
        for(var i=0;i<ready.length;i++){
          var b=await getOut(ready[i]);if(!b)continue;
          var nm=outName(ready[i]),cnt=used[nm]||0;
          used[nm]=cnt+1;if(cnt)nm=baseName(nm)+" ("+cnt+")."+ext;
          files.push(new File([b],nm,{type:b.type||fmt}));
        }
        if(!files.length||!navigator.canShare({files:files})){
          flash("File terlalu banyak untuk dibagikan sekaligus. Pakai Unduh.");return;
        }
        await navigator.share({files:files});
      }catch(e){
        if(e&&e.name!=="AbortError")flash(e.name==="NotAllowedError"?"Ketuk Bagikan sekali lagi.":"Gagal membagikan.");
      }finally{
        updateUI();
      }
    });
  }
})();
</script>
<script>
(function(){
  var dp=null,inst=document.getElementById("inst"),msg=document.getElementById("instMsg");
  var standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;inst.style.display="flex";msg.textContent=""});
  document.getElementById("instBtn").addEventListener("click",async function(){
    if(!dp)return;dp.prompt();try{await dp.userChoice}catch(_){}dp=null;inst.style.display="none";
  });
  window.addEventListener("appinstalled",function(){inst.style.display="none";msg.textContent="Aplikasi terpasang."});
  if(standalone){msg.textContent="Berjalan sebagai aplikasi."}
  else setTimeout(function(){if(!dp)msg.textContent="Chrome belum menawarkan pemasangan. Kemungkinan Chrome masih menganggap app ini sudah terpasang."},3000);
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
